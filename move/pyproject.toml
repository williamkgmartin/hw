[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "move"
version = "0.1.0"
description = "CLI tool for managing boxes during a house move"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
move = "move.cli:main"
